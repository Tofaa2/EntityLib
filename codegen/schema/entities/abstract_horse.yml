class: AbstractHorse
since: "1.11"
extends: Animal
entities: [abstract_horse]
fields:
  - name: FLAGS
    type: byte
    flags:
      - {name: TAME, mask: 0x02}
      - {name: SADDLED, mask: 0x04, removed: "1.21.5"}
      - {name: BRED, mask: 0x08}
      - {name: EATING, mask: 0x10}
      - {name: STANDING, mask: 0x20}
      - {name: OPEN_MOUTH, mask: 0x40}
  - {name: OWNER_UUID, type: optional_uuid, removed: "1.19.4"}
